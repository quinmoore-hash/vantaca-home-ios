name: VantacaHome
options:
  bundleIdPrefix: com.demo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  VantacaHome:
    type: application
    platform: iOS
    sources: [VantacaHome]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.demo.vantacahome
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vantaca Home
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  VantacaHomeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [VantacaHomeTests]
    dependencies:
      - target: VantacaHome
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  VantacaHome:
    build:
      targets:
        VantacaHome: all
        VantacaHomeTests: [test]
    test:
      targets: [VantacaHomeTests]
